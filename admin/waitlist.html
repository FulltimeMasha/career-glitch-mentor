<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Glitch — Waitlist Admin</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Instrument+Sans:wght@400;600&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
<style>
body{background:#2a1030;color:#FFFCF6;font-family:'Instrument Sans',system-ui,sans-serif;margin:0;padding:20px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-family:'Outfit',sans-serif;font-weight:900;font-size:26px}
h2{font-family:'Outfit',sans-serif;font-size:19px;margin:26px 0 10px}
input[type=password]{padding:12px;border-radius:10px;border:2px solid #1C1A1F;font-size:16px;width:280px;max-width:100%}
button{background:#F92A82;color:#fff;border:3px solid #1C1A1F;border-radius:10px;padding:11px 18px;
font-family:'Outfit',sans-serif;font-weight:900;font-size:15px;cursor:pointer}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.stat{background:#FFD8EA;color:#1C1A1F;border:3px solid #1C1A1F;border-radius:12px;box-shadow:5px 5px 0 #F92A82;padding:12px 16px}
.stat b{font-family:'Outfit',sans-serif;font-size:22px;display:block}
table{border-collapse:collapse;width:100%;font-size:13px;background:rgba(255,252,246,.05)}
th,td{border:1px solid rgba(249,42,130,.4);padding:6px 8px;text-align:left;vertical-align:top}
th{font-family:'Outfit',sans-serif;background:rgba(249,42,130,.25)}
.mono{font-family:'DM Mono',monospace}
.err{color:#ff9dbd;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<h1>Career Glitch — Waitlist Admin</h1>
<div id="gate">
<p>Password:</p>
<input type="password" id="pw"> <button id="go">Open</button>
<p class="err" id="gateErr"></p>
</div>
<div id="dash" style="display:none">
<div class="stats" id="stats"></div>
<h2>Signups per day</h2>
<div id="perDay" class="mono"></div>
<h2>Last 50 signups</h2>
<div style="overflow-x:auto"><table id="tbl"></table></div>
<h2>Map orders (last 20)</h2>
<div style="overflow-x:auto"><table id="ordTbl"></table></div>
</div>
</div>
<script>
const ADMIN_PASSWORD = "bVJfmm#OqxUHrT2$b5TG";
const CG_SUPA = "https://stwzrcahhieqbabvljue.supabase.co";
const CG_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0d3pyY2FoaGllcWJhYnZsanVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1Njk4NzMsImV4cCI6MjEwNzE0NTg3M30.T8RWclXoxK8z5dqUPtSYYjAO5a6BsdLsDwaB4t7NIJM";
const CG_ROW = 1000;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
async function load(){
  const r=await fetch(CG_SUPA+"/rest/v1/creator_state?id=eq."+CG_ROW+"&select=data",{headers:{"apikey":CG_ANON,"Authorization":"Bearer "+CG_ANON}});
  const rows=await r.json();
  const s=(rows[0]&&rows[0].data&&rows[0].data.signups)||[];
  const fc=s.filter(function(x){return x.founding;}).length;
  const bySeg={}; s.forEach(function(x){bySeg[x.segment]=(bySeg[x.segment]||0)+1;});
  const byDay={}; s.forEach(function(x){const d=(x.created_at||"").slice(0,10);byDay[d]=(byDay[d]||0)+1;});
  function stat(label,val){return '<div class="stat"><b>'+esc(val)+'</b>'+esc(label)+'</div>';}
  const brUS=s.filter(function(x){return x.segment==="bridge"&&x.residency==="In the US";}).length;
  const brOut=s.filter(function(x){return x.segment==="bridge"&&x.residency==="Outside the US";}).length;
  document.getElementById("stats").innerHTML=
    stat("total signups",s.length)+stat("/start",bySeg["start"]||0)+stat("/pivot",bySeg["pivot"]||0)+
    stat("/bridge",bySeg["bridge"]||0)+stat("bridge: in the US",brUS)+stat("bridge: outside the US",brOut)+
    stat("founding spots left",50-fc);
  document.getElementById("perDay").innerHTML=Object.keys(byDay).sort().reverse().map(function(d){return esc(d)+" \u2014 "+byDay[d];}).join("<br>")||"no signups yet";
  const last=s.slice(-50).reverse();
  let h="<tr><th>Date</th><th>Segment</th><th>Name</th><th>Email</th><th>Phone</th><th>Answer</th><th>Answer 2</th><th>Conf</th><th>Founding</th><th>Pos</th><th>Src</th><th>UTM</th><th>Ref</th></tr>";
  last.forEach(function(x){
    const refs=s.filter(function(y){return String(y.ref||"")===String(x.id);}).length;
    const eff=Math.max(1,(x.position||1)-3*refs);
    h+="<tr><td class='mono'>"+esc((x.created_at||"").replace("T"," ").slice(0,16))+"</td><td>"+esc(x.segment)+"</td><td>"+esc(x.name)+"</td><td>"+esc(x.email)+"</td><td>"+esc(x.phone)+"</td><td>"+esc(x.answer)+"</td><td>"+esc(x.answer2)+"</td><td>"+esc(x.confidence)+"</td><td>"+(x.founding?"yes":"no")+"</td><td>"+esc(eff)+" (base "+esc(x.position)+")</td><td>"+esc(x.src)+"</td><td>"+esc(x.utm_source)+" / "+esc(x.utm_campaign)+"</td><td>"+esc(x.ref)+"</td></tr>";
  });
  document.getElementById("tbl").innerHTML=h;
}
async function fetchRow(id){
  const r=await fetch(CG_SUPA+"/rest/v1/creator_state?id=eq."+id+"&select=data",{headers:{"apikey":CG_ANON,"Authorization":"Bearer "+CG_ANON}});
  const rows=await r.json();
  return (rows[0]&&rows[0].data)||{};
}
async function loadExtra(){
  const od=await fetchRow(1002); const orders=od.orders||[];
  const vd=await fetchRow(1003); const views=vd.views||[];
  function stat(label,val){return '<div class="stat"><b>'+esc(val)+'</b>'+esc(label)+'</div>';}
  const byDoor={}; views.forEach(function(x){byDoor[x.door]=(byDoor[x.door]||0)+1;});
  document.getElementById("stats").innerHTML+=
    stat("map orders",orders.length)+stat("views /start",byDoor["start"]||0)+
    stat("views /pivot",byDoor["pivot"]||0)+stat("views /bridge",byDoor["bridge"]||0);
  const last=orders.slice(-20).reverse();
  let h="<tr><th>Date</th><th>Door</th><th>Email</th><th>Profession</th><th>Situation</th><th>State</th><th>Residency</th><th>Tried</th></tr>";
  last.forEach(function(x){
    h+="<tr><td class='mono'>"+esc((x.created_at||"").replace("T"," ").slice(0,16))+"</td><td>"+esc(x.door)+"</td><td>"+esc(x.email)+"</td><td>"+esc(x.profession)+"</td><td>"+esc(x.situation)+"</td><td>"+esc(x.state)+"</td><td>"+esc(x.residency)+"</td><td>"+esc(x.tried)+"</td></tr>";
  });
  document.getElementById("ordTbl").innerHTML=h;
}
function openDash(){
  document.getElementById("gate").style.display="none";
  document.getElementById("dash").style.display="block";
  load().then(function(){return loadExtra();}).catch(function(e){document.getElementById("perDay").textContent="Load error: "+e.message;});
}
document.getElementById("go").addEventListener("click",function(){
  if(document.getElementById("pw").value===ADMIN_PASSWORD){sessionStorage.setItem("cgAdminOK","1");openDash();}
  else document.getElementById("gateErr").textContent="Wrong password.";
});
if(sessionStorage.getItem("cgAdminOK")==="1")openDash();
</script>
</body>
</html>
